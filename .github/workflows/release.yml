name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  DOTNET_ROLL_FORWARD: LatestMajor
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish-nuget:
    name: Pack and publish to nuget.org
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink needs full history for the deterministic build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack all packages
        shell: pwsh
        run: |
          $projects = @(
            'Multi',
            'Paginable',
            'Paginable.Chloe',
            'Paginable.DosOrm',
            'Paginable.EntityFramework',
            'Paginable.EntityFrameworkCore',
            'Paginable.FreeSql',
            'Paginable.FreeSql.DbContext',
            'Paginable.NHibernate',
            'Paginable.SqlKata',
            'Paginable.SqlSugar'
          )

          New-Item -ItemType Directory -Force -Path nuget_pub | Out-Null

          foreach ($p in $projects) {
            # -m:1 is required: DocumentationFile is a single project-root file, so
            # parallel per-TFM builds race on it (CS0016). Serialising the inner
            # builds keeps packing deterministic.
            dotnet pack "src/DotNetCore.Collections.$p" -c Release -m:1 -o nuget_pub
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Push packages to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Error 'NUGET_API_KEY secret is not configured.'
            exit 1
          }

          foreach ($pattern in @('*.nupkg', '*.snupkg')) {
            Get-ChildItem nuget_pub -Filter $pattern | ForEach-Object {
              Write-Host "Pushing $($_.Name)"
              dotnet nuget push $_.FullName `
                --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
